name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Lint & Typecheck — schnell, läuft parallel zu Tests
  # ─────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus package.json#packageManager — kein `version:`-Input,
      # sonst ERR_PNPM_BAD_PM_VERSION. pnpm-12-Support gibt es ab action-setup 6.1.0
      # (der Tag `v6` zeigt noch auf 6.0.10).
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma-Client erzeugen: Prisma 7 erzeugt ihn nicht beim Installieren
      # (@prisma/client hat kein Install-Skript). `generate` verbindet sich nicht mit der DB, prisma.config.ts
      # verlangt aber eine gesetzte DATABASE_URL — daher ein Platzhalter.
      - name: Generate Prisma client
        run: pnpm --filter @jass/api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ─────────────────────────────────────────────────────────────────
  # Dependency-Audit — schlägt bei high/critical CVEs an
  # ─────────────────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus package.json#packageManager — kein `version:`-Input,
      # sonst ERR_PNPM_BAD_PM_VERSION. pnpm-12-Support gibt es ab action-setup 6.1.0
      # (der Tag `v6` zeigt noch auf 6.0.10).
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit --prod --audit-level high` schlägt fehl, wenn eine
      # production-Dependency eine Schwachstelle mit High+/Critical-
      # Severity hat. Moderate/Low werden geloggt aber nicht gateted —
      # sonst würde CI bei jedem npm-Drift-Tag rot blinken.
      - name: pnpm audit (production deps only, high+)
        run: pnpm audit --prod --audit-level high
        continue-on-error: false

      # Moderate-Severity-Check als separater Step mit `continue-on-error`,
      # damit es als Warn-Signal erscheint, ohne den CI-Lauf zu killen.
      - name: pnpm audit moderate (warn-only)
        run: pnpm audit --prod --audit-level moderate
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # Unit-Tests + Coverage-Gates
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus package.json#packageManager — kein `version:`-Input,
      # sonst ERR_PNPM_BAD_PM_VERSION. pnpm-12-Support gibt es ab action-setup 6.1.0
      # (der Tag `v6` zeigt noch auf 6.0.10).
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Siehe Job „Lint & Typecheck".
      - name: Generate Prisma client
        run: pnpm --filter @jass/api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # NN-Artefakt syncen, weil packages/engine-Fixture-Tests sonst
      # nicht laufen können (encoding_fixtures.json + jass_rules.json
      # liegen außerhalb des Repos in external/jass-nn/).
      # `GH_TOKEN` braucht der `gh release download`-Call im sync-Skript.
      # `continue-on-error: true` weil das NN-Repo evtl. in einem anderen
      # Org liegt — falls der GITHUB_TOKEN keinen Read-Zugang hat,
      # melden die Fixture-Tests „nicht gefunden" und können temporär
      # auf einen Folge-PR warten.
      - name: Sync NN artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync:nn
        continue-on-error: true

      - name: Run unit tests with coverage
        run: pnpm test:unit -- --coverage --reporter=default

      # Coverage-Gates aus dem Plan-Doc:
      #   - packages/engine ≥ 95%
      #   - apps/api        ≥ 80%
      #   - apps/web        ≥ 60%
      # Wir nutzen vitest's eingebauten threshold-Mechanismus (siehe
      # vitest.config.ts in den jeweiligen Workspaces) — der Step hier
      # bestätigt nur, dass die threshold-Files existieren (eine
      # Konfig-Drift-Sicherung).
      - name: Verify coverage thresholds configured
        run: |
          set -e
          for pkg in packages/engine apps/api apps/web; do
            if [ -f "$pkg/vitest.config.ts" ] && ! grep -q "thresholds" "$pkg/vitest.config.ts"; then
              echo "::error file=$pkg/vitest.config.ts::Coverage-Thresholds nicht konfiguriert"
              exit 1
            fi
          done

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Integration-Tests der API — gegen echte Postgres-/Redis-Container
  # (Testcontainers über den Docker-Daemon des Runners). Fängt, was
  # Unit-Tests nicht sehen: Auth-Flows, WebSockets, Validierung an den
  # echten Endpunkten.
  # ─────────────────────────────────────────────────────────────────
  integration:
    name: Integration tests (API)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Schutz gegen hängende Tests (GitHub-Default: 360 min). Normal sind
    # wenige Minuten: alle Files in EINEM Worker, Container einmal gebootet.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version kommt aus package.json#packageManager — kein `version:`-Input,
      # sonst ERR_PNPM_BAD_PM_VERSION. pnpm-12-Support gibt es ab action-setup 6.1.0
      # (der Tag `v6` zeigt noch auf 6.0.10).
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Siehe Job „Lint & Typecheck". Die echte DATABASE_URL setzt das
      # Test-Setup selbst (Testcontainer).
      - name: Generate Prisma client
        run: pnpm --filter @jass/api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # turbo baut vorher die Workspace-Abhängigkeiten (`^build`: engine,
      # shared-types), die die API aus `dist/` importiert.
      - name: Run API integration tests
        run: pnpm test:integration
