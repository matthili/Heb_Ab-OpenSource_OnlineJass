# Default-Values für das jass-app Helm-Chart.
#
# Vor `helm install` mindestens überschreiben:
#   - `image.tag`        — Tag der selbst gebauten Images (es gibt keine
#                          veröffentlichten; siehe README)
#   - `postgres.url`     — DSN zur externen Postgres-Instanz
#   - `redis.host` + `redis.port` — Adresse der externen Redis-Instanz
#   - `secrets.betterAuthSecret` — beliebige zufällige 32-Byte-Hexkette
#   - `secrets.appSecret`        — separat von BETTER_AUTH_SECRET (AES-Key
#                                  für SMTP-Passwort-Verschlüsselung)
#   - `secrets.turnstileSecretKey` — Turnstile-Secret (ohne startet die API in
#                                  production nicht)
#   - `ingress.host`     — Public-Hostname (für TLS + Origin-Prüfung)
#   - `api.env.adminEmail` — Konto, das beim Registrieren Admin wird
#
# Production-Pattern: man legt eine `values-prod.yaml` an, die nur die
# überschriebenen Felder enthält, und installiert mit
#   `helm install jass-app . -f values-prod.yaml`.

# ─── Globales ──────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# Image-Tag-Konvention: in CI auf den Commit-SHA setzen, lokal/dev auf
# "dev". `pullPolicy: IfNotPresent` reicht für getaggte Images; bei
# Floating-Tags wie "latest" auf "Always" gehen — wir empfehlen aber
# unveränderliche Tags pro Release. Das Repo veröffentlicht keine Images:
# selbst bauen (apps/*/Dockerfile) und in die eigene Registry pushen. Ohne
# `image.tag` bricht `helm install` mit einer klaren Meldung ab.
image:
  registry: ghcr.io/matthili
  apiRepository: jass-api
  inferenceRepository: jass-inference
  webRepository: jass-web
  landingRepository: jass-landing
  tag: ""
  pullPolicy: IfNotPresent
  # Optional: imagePullSecrets, falls Registry private ist.
  pullSecrets: []

# ─── Externe Datenstores ───────────────────────────────────────────────
# Postgres + Redis sind absichtlich NICHT im Chart enthalten. Production
# soll Managed-Postgres + Managed-Redis nutzen (oder bestehende On-Prem-
# Instanzen). Das Chart erwartet:
#   - postgres.url:   "postgresql://user:pass@host:5432/dbname?sslmode=require"
#   - redis.host,port,db,password (TLS-Flag bei Bedarf)
postgres:
  url: ""
  # Wenn `existingSecretName` gesetzt ist, wird POSTGRES_URL daraus gelesen
  # (Key `url`). Sonst wird ein vom Chart erzeugter Secret verwendet.
  existingSecretName: ""

redis:
  host: ""
  port: 6379
  db: 0
  password: ""
  tls: false
  existingSecretName: ""

# ─── Secrets (App-intern) ──────────────────────────────────────────────
secrets:
  # 32-Byte-Hex empfohlen (`openssl rand -hex 32`). Better Auth signiert
  # damit die Session-Cookies.
  betterAuthSecret: ""
  # AES-256-GCM-Key für verschlüsseltes SMTP-Passwort in AdminSetting.
  # Separat von BETTER_AUTH_SECRET, weil unterschiedliche Lebensdauer.
  appSecret: ""
  # Geheimer Turnstile-Schlüssel (Cloudflare). Pflicht: in production bricht
  # die API den Start ohne ihn ab. Den öffentlichen Site-Key braucht dagegen
  # das Web-Image schon beim Build (Build-Arg VITE_TURNSTILE_SITE_KEY).
  turnstileSecretKey: ""
  # Wenn gesetzt, kommen alle drei Secrets aus diesem existing-Secret
  # (Keys: better-auth-secret, app-secret, turnstile-secret-key). Sonst wird
  # `<release>-secrets` gerendert.
  existingSecretName: ""

# ─── API (NestJS + Socket.IO) ──────────────────────────────────────────
api:
  # EINE Replik, kein HPA: Der Spiel-Lock (GameLockService) und die Timer der
  # Disconnect-Abstimmung liegen im Speicher des API-Prozesses. Bei mehreren
  # Repliken könnten Züge am selben Tisch auf verschiedenen Pods landen, ohne
  # dass der Lock sie gegeneinander schützt. Erst mit einem verteilten Lock
  # (z. B. Redis SET NX EX) hochdrehen.
  replicas: 1
  # Recreate statt RollingUpdate: auch beim Update nie zwei API-Pods zugleich
  # (kurze Downtime statt eines Fensters mit zwei Instanzen).
  strategy: Recreate
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 768Mi }
  env:
    # Zusätzliche vertrauenswürdige Origins (kommagetrennt, → TRUSTED_ORIGINS).
    # Der Ingress-Host selbst ist immer vertrauenswürdig.
    extraOrigins: ""
    # Wer sich mit dieser Adresse registriert (oder schon registriert ist),
    # wird Admin — der Weg zum ersten Admin; die CLI admin:grant gibt es im
    # Image nicht. Leer = kein automatischer Admin.
    adminEmail: ""
  # HPA bleibt aus, solange der Spiel-Lock In-Memory ist (siehe replicas).
  # Die Schwellen sind für später vorbereitet.
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podAnnotations: {}

# ─── Inferenz-Microservice ─────────────────────────────────────────────
inference:
  replicas: 2
  port: 4000
  # Welche Modelle beim Start geladen werden (→ INFERENCE_GAME_TYPES). Ohne
  # Angabe lädt der Dienst nur kreuz + solo.
  gameTypes: "kreuz,solo,bodensee"
  resources:
    # Pure-JS-TF.js mit drei Modellen (eines je Spielart) im Speicher.
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 1.5Gi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
  podAnnotations: {}

# ─── Web-SPA (statisches Vite-Build, Nginx-served) ─────────────────────
# Web und Landing laufen als Stock-nginx unter der Nicht-root-UID aus
# podSecurityContext. Die Templates hängen dafür emptyDirs für die Cache- und
# PID-Pfade ein und erlauben per Pod-Sysctl Port 80 ohne root.
web:
  replicas: 2
  port: 80
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ─── Landing (Astro-Static, Nginx-served) ──────────────────────────────
landing:
  replicas: 2
  port: 80
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# ─── Ingress ───────────────────────────────────────────────────────────
# Annotations für den (seit 03/2026 eingestellten) ingress-nginx-Controller:
# Cookie-Affinity für /ws (greift erst bei mehreren API-Repliken) und ein
# eigenes Ingress-Objekt für /app, das das Präfix abschneidet — das Web-Image
# liefert am Root aus (wie hinter Caddy). Bei anderen Controllern müssen
# `annotations` und der /app-Rewrite angepasst werden.
ingress:
  enabled: true
  className: "nginx"
  host: "jass.example.com"
  # Cert-Manager-Annotation für automatisches TLS — durch
  # `certManager.enabled: false` ausschaltbar.
  tls:
    enabled: true
    secretName: "jass-app-tls"
    clusterIssuer: "letsencrypt-prod"
  annotations: {}

# ─── ServiceAccount / Security ─────────────────────────────────────────
serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # Bleibt aus: nicht für alle Images geprüft, welche Pfade beschreibbar sein
  # müssen. Inferenz-Modelle und die nginx-Pfade liegen schon auf emptyDirs.
  readOnlyRootFilesystem: false
