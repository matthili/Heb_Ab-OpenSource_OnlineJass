{{- $component := "inference" }}
{{- $fullname := printf "%s-%s" (include "jass-app.fullname" .) $component }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jass-app.component.labels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  replicas: {{ .Values.inference.replicas }}
  selector:
    matchLabels:
      {{- include "jass-app.component.selectorLabels" (merge (dict "component" $component) .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jass-app.component.selectorLabels" (merge (dict "component" $component) .) | nindent 8 }}
      {{- with .Values.inference.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jass-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: inference
          image: "{{ .Values.image.registry }}/{{ .Values.image.inferenceRepository }}:{{ required "image.tag muss gesetzt sein (Tag der selbst gebauten Images)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.inference.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            # Der Dienst liest INFERENCE_PORT (server.ts), nicht PORT.
            - name: INFERENCE_PORT
              value: {{ .Values.inference.port | quote }}
            - name: INFERENCE_GAME_TYPES
              value: {{ .Values.inference.gameTypes | quote }}
            # Die Modelle stecken NICHT im Image: Der Entrypoint lädt sie beim
            # Start per scripts/fetch-nn.mjs aus den öffentlichen JCN9000-
            # Releases hierher (emptyDir unten → bei jedem Pod-Start neu). Der
            # Pod braucht dafür ausgehenden Zugriff auf GitHub.
            - name: MODEL_DIR
              value: "/app/external/jass-nn"
          volumeMounts:
            - name: models
              mountPath: /app/external/jass-nn
          # Download + Modell-Laden: bis zu 5 min Zeit, bevor Liveness greift.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          resources:
            {{- toYaml .Values.inference.resources | nindent 12 }}
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jass-app.component.labels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.inference.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "jass-app.component.selectorLabels" (merge (dict "component" $component) .) | nindent 4 }}
{{- if .Values.inference.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jass-app.component.labels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ .Values.inference.hpa.minReplicas }}
  maxReplicas: {{ .Values.inference.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.inference.hpa.targetCPUUtilizationPercentage }}
{{- end }}
